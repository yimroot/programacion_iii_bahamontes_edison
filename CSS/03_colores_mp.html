<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: #0b1020;
        }

        h1 {
            color: #Ff0000;
        }

        h2 {
            color: rgb(255, 0, 0);
        }

        h3 {
            color: red;
        }

        h4 {
            color: rgba(255, 0, 0, 0.5);
        }

        h5 {
            color: hsl(0, 100%, 50%);
        }
    </style>
    <link rel="stylesheet" href="03_colores_mp.css">
</head>

<body>
    <h1>Maneras de establecer colores</h1>
    <h2>hexadecimal - Cementerio Montes de Paz</h2>
    <h3>RGB - Servicios Funerarios</h3>
    <h4>RGBA - Planes de Previsión</h4>
    <h5>HSK - Capilla Principal</h5>
</body>

</html>
